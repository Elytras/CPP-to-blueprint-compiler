# Builds every example. From the AssetGen folder: python tools/bpbuild.py examples <UeApi dir> <assetgen>
# The paks land in examples/out/, and --no-pak compiles without packing.
mods:
  - name: HelloWorld
    sources: [HelloWorld.cpp]
  - name: WaitForPlayer
    sources: [WaitForPlayer.cpp]
  - name: Beacon
    sources: [Beacon.cpp]
  - name: Scoreboard
    sources: [Scoreboard.cpp]
  - name: NetworkedSwitch
    sources: [NetworkedSwitch.cpp]
  - name: EnemyInfo
    sources: [EnemyInfo.cpp]
  - name: GameBlueprintChild
    sources: [GameBlueprintChild.cpp]
  - name: AwaitEvents
    sources: [AwaitEvents.cpp]
  - name: MemoryRead
    sources: [MemoryRead.cpp]
  - name: MathLib
    sources: [MathLib.cpp]
    generate_api: true
  - name: LibraryUser
    sources: [LibraryUser.cpp]
    needs: [MathLib]
    embed: true
